# Adapted from https://github.com/posit-dev/setup-air
on:
  push:
    branches: [main]
  pull_request:

name: air

jobs:
  air:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Air
        uses: posit-dev/setup-air@v1

      - name: Check formatting
        run: air format . --check
